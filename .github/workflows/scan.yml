name: Radar scan

on:
  schedule:
    - cron: "5 * * * *"      # every hour at :05 (UTC). GitHub can start scheduled runs a few minutes late.
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write             # to save the score history on the `history` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load score history
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" history >/dev/null; then
            git clone --quiet --depth 1 --branch history "$REMOTE" history
          else
            mkdir history && git -C history init --quiet -b history && git -C history remote add origin "$REMOTE"
          fi

      - name: Scan
        env:
          HISTORY_DIR: history
        run: python scanner/scan.py

      - name: Save score history
        continue-on-error: true
        run: |
          cd history
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "scores $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push --quiet origin history

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
